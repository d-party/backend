version: 2
updates:
  # Python 依存は uv（pyproject.toml + uv.lock）で管理している。
  # pip エコシステムでは uv.lock を更新できないため "uv" を使う。
  # リポジトリ直下が django プロジェクトなので directory は "/"。
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
      time: "12:00"
    target-branch: main
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # 定期のバージョン更新だけまとめる。セキュリティ更新は
      # 個別 PR のまま（applies-to: version-updates）にして、
      # 1 件ずつ影響を確認できるようにする。
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
      time: "12:00"
    target-branch: main
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
      time: "12:00"
    target-branch: main
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
